name: Base Open Food Facts et site

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construire produits-off.json depuis l'export officiel Open Food Facts
        if: github.event_name != 'push' || hashFiles('produits-off.json') == ''
        run: python construire_base_off.py --out produits-off.json
      - name: Garder le fichier dans le dépôt
        if: github.event_name != 'push' || hashFiles('produits-off.json') == ''
        run: |
          git config user.name "maj-base-off"
          git config user.email "maj-base-off@users.noreply.github.com"
          git add produits-off.json
          git diff --cached --quiet || git commit -m "Mise à jour de la base Open Food Facts"
          git push
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp index.html _site/
          if [ -f produits-off.json ]; then cp produits-off.json _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
